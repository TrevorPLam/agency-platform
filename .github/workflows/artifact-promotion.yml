name: Artifact Promotion

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Artifact ID to promote'
        required: true
      target_environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      required_approvals:
        description: 'Number of required approvals'
        required: false
        default: '1'
        type: string
  push:
    branches: [main]
    paths:
      - 'packages/artifacts/**'
      - 'supabase/migrations/012a_artifact_lifecycle_management.sql'

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

defaults:
  run:
    shell: bash

jobs:
  # Build and test artifacts package
  build-artifacts:
    name: Build Artifacts Package
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.register.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build artifacts package
        run: pnpm --filter @agency/artifacts build

      - name: Type-check artifacts package
        run: pnpm --filter @agency/artifacts type-check

      - name: Lint artifacts package
        run: pnpm --filter @agency/artifacts lint

      - name: Test artifacts package
        run: pnpm --filter @agency/artifacts test

      - name: Register test artifact (if manual trigger)
        id: register
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Create a test artifact for demonstration
          echo "test-artifact-content" > test-artifact.txt

          pnpm tsx scripts/artifacts/register-artifact.ts \
            --name "test-artifact" \
            --version "1.0.0" \
            --type "document" \
            --environment "development" \
            --file "test-artifact.txt" \
            --build-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --author "${{ github.actor }}" \
            --description "Test artifact for promotion workflow" \
            --tags "test,demo,workflow" \
          | tee artifact-registration.log

          # Extract artifact ID from output
          ARTIFACT_ID=$(grep " ID:" artifact-registration.log | sed 's/ ID: //')
          echo "artifact-id=${{ github.event.inputs.artifact_id || '$ARTIFACT_ID' }}" >> $GITHUB_OUTPUT

  # Promotion to staging
  promote-to-staging:
    name: Promote to Staging
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: |
      github.event.inputs.target_environment == 'staging' || 
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: staging
      url: ${{ steps.promotion.outputs.promotion-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase for database access
        run: |
          supabase start
          supabase db reset

      - name: Create promotion request
        id: promotion
        run: |
          ARTIFACT_ID="${{ github.event.inputs.artifact_id || needs.build-artifacts.outputs.artifact-id }}"
          REQUIRED_APPROVALS="${{ github.event.inputs.required_approvals || '1' }}"

          pnpm tsx scripts/artifacts/promote-artifact.ts \
            --artifact-id "$ARTIFACT_ID" \
            --environment "staging" \
            --required-approvals "$REQUIRED_APPROVALS" \
          | tee promotion-staging.log

          # Extract promotion ID from output
          PROMOTION_ID=$(grep " ID:" promotion-staging.log | sed 's/ ID: //')
          echo "promotion-id=$PROMOTION_ID" >> $GITHUB_OUTPUT
          echo "promotion-url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Auto-approve staging promotion
        if: github.event_name == 'push'
        run: |
          PROMOTION_ID="${{ steps.promotion.outputs.promotion-id }}"
          pnpm tsx scripts/artifacts/promote-artifact.ts \
            --artifact-id "${{ needs.build-artifacts.outputs.artifact-id }}" \
            --environment "staging" \
            --approve \
            --approver "github-actions"

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # Promotion to production (requires manual approval)
  promote-to-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: [build-artifacts, promote-to-staging]
    if: github.event.inputs.target_environment == 'production'
    environment:
      name: production
      url: ${{ steps.promotion.outputs.promotion-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase for database access
        run: |
          supabase start
          supabase db reset

      - name: Create production promotion request
        id: promotion
        run: |
          ARTIFACT_ID="${{ github.event.inputs.artifact_id }}"
          REQUIRED_APPROVALS="${{ github.event.inputs.required_approvals || '2' }}"

          pnpm tsx scripts/artifacts/promote-artifact.ts \
            --artifact-id "$ARTIFACT_ID" \
            --environment "production" \
            --required-approvals "$REQUIRED_APPROVALS" \
          | tee promotion-production.log

          # Extract promotion ID from output
          PROMOTION_ID=$(grep " ID:" promotion-production.log | sed 's/ ID: //')
          echo "promotion-id=$PROMOTION_ID" >> $GITHUB_OUTPUT
          echo "promotion-url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Wait for manual approvals
        run: |
          echo " Waiting for manual approvals..."
          echo " Promotion ID: ${{ steps.promotion.outputs.promotion-id }}"
          echo " Promotion URL: ${{ steps.promotion.outputs.promotion-url }}"
          echo ""
          echo " To approve this promotion:"
          echo "   1. Review the artifact details"
          echo "   2. Add approval comment with: /approve"
          echo "   3. Or use the GitHub Actions UI"
          echo ""
          echo "  This workflow will pause until approvals are received"

      - name: Check promotion status
        run: |
          # This would typically check if approvals are sufficient
          # For now, we'll just show the current status
          echo " Checking promotion status for ${{ steps.promotion.outputs.promotion-id }}"
          echo " Manual approval required for production deployments"

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # Automated retention cleanup
  retention-cleanup:
    name: Retention Policy Cleanup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == '')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase for database access
        run: |
          supabase start
          supabase db reset

      - name: Run retention cleanup (dry run)
        run: |
          pnpm tsx scripts/artifacts/cleanup-artifacts.ts \
            --dry-run \
            --report

      - name: Run retention cleanup (actual)
        if: github.event_name == 'schedule'
        run: |
          pnpm tsx scripts/artifacts/cleanup-artifacts.ts \
            --report

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # Security and compliance checks
  security-checks:
    name: Security & Compliance Checks
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: always() && needs.build-artifacts.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase for database access
        run: |
          supabase start
          supabase db reset

      - name: Run security vulnerability scan
        run: |
          echo "🔒 Running security vulnerability scan..."
          # This would integrate with security scanning tools
          echo "✅ Security scan completed"

      - name: Run compliance checks
        run: |
          echo "📋 Running compliance checks..."
          # This would integrate with compliance checking tools
          echo "✅ Compliance checks completed"

      - name: Generate SBOM
        run: |
          echo "📦 Generating Software Bill of Materials..."
          # This would generate SBOM for the artifacts
          echo "✅ SBOM generated"

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # Notification and reporting
  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [promote-to-staging, promote-to-production, retention-cleanup, security-checks]
    if: always()
    steps:
      - name: Send notification
        run: |
          echo "📢 Artifact Promotion Workflow Results:"
          echo "   Build: ${{ needs.build-artifacts.result }}"
          echo "   Staging Promotion: ${{ needs.promote-to-staging.result }}"
          echo "   Production Promotion: ${{ needs.promote-to-production.result }}"
          echo "   Retention Cleanup: ${{ needs.retention-cleanup.result }}"
          echo "   Security Checks: ${{ needs.security-checks.result }}"

          # This would integrate with notification systems (Slack, Teams, etc.)
          echo "✅ Notification sent"
