name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  # Required for --affected in detached HEAD or when base branch is not checked out
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: Build, Lint, Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for --affected to compare against base branch

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Security scan (service role key exposure)
        run: |
          if grep -rE "NEXT_PUBLIC_.*SERVICE_ROLE|NEXT_PUBLIC_SUPABASE_SERVICE" \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            apps/ packages/ 2>/dev/null; then
            echo "CRITICAL: Service role key exposed in client-visible code."
            exit 1
          fi
          echo "Security scan passed."

      - name: Security scan (user_metadata in database package)
        run: |
          # Only packages/database/src/auth.ts may use user_metadata (Supabase createUser payload for display data; tenant is in app_metadata). See SECURITY.md Vector 1.
          unauthorized=$(grep -r "user_metadata" --include="*.ts" packages/database/ -l 2>/dev/null | grep -v "src/auth.ts" || true)
          if [ -n "$unauthorized" ]; then
            echo "CRITICAL: user_metadata used in database package outside allowed auth.ts createUser payload."
            echo "$unauthorized"
            exit 1
          fi
          echo "user_metadata check passed."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (Postgres only for types drift check)
        run: |
          supabase db start
          supabase db reset

      - name: Types drift check
        run: |
          echo "🔄 Checking database types for drift..."
          cd packages/database

          # Use the validation script for better error handling
          if ! pnpm db:types:check; then
            echo ""
            echo "❌ DATABASE TYPES ARE OUT OF SYNC"
            echo ""
            echo "This happens when database schema changes but types.ts wasn't updated."
            echo ""
            echo "🔧 TO FIX:"
            echo "   1. Ensure Docker Desktop is running"
            echo "   2. Run: supabase start && supabase db reset"
            echo "   3. Run: pnpm db:types:update"
            echo "   4. Commit the updated packages/database/src/types.ts"
            echo ""
            echo "📖 For more help, see CONTRIBUTING.md section 'Database Type Generation'"
            exit 1
          fi

          echo "✅ Database types are up to date"

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Build affected packages
        run: pnpm turbo run build --affected

      - name: Lint affected packages
        run: pnpm turbo run lint --affected

      - name: Type-check affected packages
        run: pnpm turbo run type-check --affected

      - name: Test affected packages
        run: pnpm turbo run test:ci --affected

      - name: Coverage gate (affected packages)
        run: pnpm turbo run test:coverage --affected

      - name: Accessibility tests (affected packages)
        run: pnpm turbo run test:a11y --affected

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/coverage/**'
          retention-days: 14

  rls-tests:
    name: RLS Isolation Tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local environment
        run: supabase start

      - name: Run pgTAP RLS tests
        run: supabase test db

      - name: Upload TAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-tap-results
          path: '**/*.tap'
          retention-days: 14

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  rls-supashield:
    name: Supashield RLS Audit
    runs-on: ubuntu-latest
    needs: rls-tests
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Start Supabase
        run: supabase start

      - name: Install Supashield
        run: npm install -g supashield

      - name: Run RLS audit and fail on unexpected ALLOW
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_LOCAL_SERVICE_ROLE }}
        run: |
          supashield test --output json > supashield-report.json
          node -e "
            const fs = require('fs');
            const path = './supashield-report.json';
            if (!fs.existsSync(path)) {
              console.error('Supashield report not found. Run may have failed.');
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const fails = (r.results || []).filter(t => t.status === 'FAIL');
            if (fails.length > 0) {
              console.error('RLS GAPS DETECTED:', JSON.stringify(fails, null, 2));
              process.exit(1);
            }
            console.log('All RLS policies verified.');
          "

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supashield-rls-audit
          path: supashield-report.json
