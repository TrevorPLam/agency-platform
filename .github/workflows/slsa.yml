name: SLSA Build Attestations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

permissions:
  contents: read
  actions: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-generate-provenance:
    name: Build and Generate SLSA Provenance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - name: agency-admin
            path: apps/agency-admin
          - name: firm
            path: apps/firm
          # When adding production clients under apps/clients/, add them to this matrix.
          - name: riley-day-care
            path: apps/prospective-clients/riley-day-care
          - name: the-barber-cave
            path: apps/prospective-clients/the-barber-cave

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm turbo run build --filter="${{ matrix.package.name }}"

      - name: Generate build artifact
        run: |
          mkdir -p provenance-artifacts/${{ matrix.package.name }}
          
          # Copy build artifacts
          if [ -d "${{ matrix.package.path }}/dist" ]; then
            cp -r ${{ matrix.package.path }}/dist provenance-artifacts/${{ matrix.package.name }}/
          fi
          
          if [ -d "${{ matrix.package.path }}/.next" ]; then
            cp -r ${{ matrix.package.path }}/.next provenance-artifacts/${{ matrix.package.name }}/
          fi
          
          # Copy package.json for dependency tracking
          cp ${{ matrix.package.path }}/package.json provenance-artifacts/${{ matrix.package.name }}/
          
          # Generate build metadata
          cat > provenance-artifacts/${{ matrix.package.name }}/build-metadata.json << EOF
          {
            "buildTime": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "buildId": "${{ github.run_id }}-${{ github.run_attempt }}",
            "commitSha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "workflow": "${{ github.workflow }}",
            "repository": "${{ github.repository }}",
            "runner": "${{ runner.os }}",
            "packageName": "${{ matrix.package.name }}",
            "packagePath": "${{ matrix.package.path }}"
          }
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.package.name }}
          path: provenance-artifacts/${{ matrix.package.name }}/
          retention-days: 30

      - name: Generate package attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: provenance-artifacts/${{ matrix.package.name }}/build-metadata.json

  verify-provenance:
    name: Verify SLSA Provenance
    runs-on: ubuntu-latest
    needs: build-and-generate-provenance
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install slsa-verifier
        run: |
          go install github.com/slsa-framework/slsa-verifier/v2/cmd/slsa-verifier@latest

      - name: Download provenance artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: provenance-*
          merge-multiple: true
          path: provenance-downloads/

      - name: Verify SLSA provenance
        run: |
          echo "Verifying SLSA provenance for all packages..."
          
          for provenance_file in provenance-downloads/*.attestation; do
            if [ -f "$provenance_file" ]; then
              echo "Verifying: $provenance_file"
              slsa-verifier verify-artifact \
                --source-uri "github.com/${{ github.repository }}" \
                --source-tag "${{ github.ref_name }}" \
                "$provenance_file" || echo "Warning: Verification failed for $provenance_file"
            fi
          done

  provenance-summary:
    name: Generate Provenance Summary
    runs-on: ubuntu-latest
    needs: [build-and-generate-provenance, verify-provenance]
    if: always()

    steps:
      - name: Download all provenance artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: provenance-*
          merge-multiple: true
          path: all-provenance/

      - name: Generate provenance report
        run: |
          cat > provenance-summary.md << 'EOF'
          # SLSA Provenance Report
          
          **Generated**: $(date)
          **Repository**: ${{ github.repository }}
          **Commit**: ${{ github.sha }}
          **Workflow**: ${{ github.workflow }}
          **Run ID**: ${{ github.run_id }}
          
          ## SLSA Compliance
          - **Level**: SLSA Level 3 (Build provenance with hardened build platform)
          - **Framework**: SLSA Framework (slsa.dev)
          - **Verification**: GitHub Artifact Attestations
          
          ## Generated Attestations
          EOF

          # List all provenance files
          if [ -d "all-provenance" ]; then
            for attestation in all-provenance/*.attestation; do
              if [ -f "$attestation" ]; then
                filename=$(basename "$attestation")
                echo "- ✅ $filename" >> provenance-summary.md
              fi
            done
          fi
          
          cat >> provenance-summary.md << 'EOF'
          
          ## Security Benefits
          1. **Build Integrity**: Cryptographic proof of build process
          2. **Source Verification**: Link to exact source code commit
          3. **Builder Attestation**: Verified GitHub Actions build environment
          4. **Dependency Tracking**: Complete bill of materials
          5. **Tamper Resistance**: Immutable provenance records
          
          ## Compliance Alignment
          - **SOC 2**: Security controls for software supply chain
          - **ISO 27001**: Information security management
          - **NIST SSDF**: Secure software development framework
          - **CISA SBOM**: Software bill of materials requirements
          
          ## Verification Commands
          To verify these attestations externally:
          
          \`\`\`bash
          # Install slsa-verifier
          go install github.com/slsa-framework/slsa-verifier/v2/cmd/slsa-verifier@latest
          
          # Verify specific attestation
          slsa-verifier verify-artifact \
            --source-uri "github.com/${{ github.repository }}" \
            --source-tag "${{ github.ref_name }}" \
            path/to/attestation.json
          \`\`\`
          
          ---
          *Generated by Agency Platform SLSA Workflow*
          EOF

      - name: Upload provenance summary
        uses: actions/upload-artifact@v4
        with:
          name: provenance-summary
          path: provenance-summary.md
          retention-days: 90

      - name: Comment PR with provenance summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const summary = fs.readFileSync('provenance-summary.md', 'utf8')
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 SLSA Provenance Generated\n\n${summary}`
            })
