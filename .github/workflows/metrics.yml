name: DORA Metrics Collection

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      time_window_days:
        description: 'Time window in days for metrics calculation'
        required: false
        default: '30'
        type: string
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/metrics.yml'

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  collect-metrics:
    name: Collect DORA Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for full git history

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter=@agency/metrics

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase for local operations
        run: |
          supabase db start
          supabase db reset

      - name: Create metrics database schema
        run: |
          # Create deployments table
          cat << 'EOF' | supabase db push
          create table if not exists deployments (
            id text primary key,
            timestamp timestamptz not null,
            commit_sha text not null,
            environment text not null check (environment in ('production', 'staging', 'development')),
            service text not null,
            status text not null check (status in ('success', 'failure', 'rollback')),
            metadata jsonb,
            created_at timestamptz default now(),
            updated_at timestamptz default now()
          );

          create index if not exists idx_deployments_timestamp on deployments(timestamp);
          create index if not exists idx_deployments_environment on deployments(environment);
          create index if not exists idx_deployments_service on deployments(service);
          create index if not exists idx_deployments_commit_sha on deployments(commit_sha);
          EOF

          # Create incidents table
          cat << 'EOF' | supabase db push
          create table if not exists incidents (
            id text primary key,
            detected_at timestamptz not null,
            resolved_at timestamptz,
            severity text not null check (severity in ('low', 'medium', 'high', 'critical')),
            deployment_id text references deployments(id),
            description text not null,
            service text not null,
            metadata jsonb,
            created_at timestamptz default now(),
            updated_at timestamptz default now()
          );

          create index if not exists idx_incidents_detected_at on incidents(detected_at);
          create index if not exists idx_incidents_resolved_at on incidents(resolved_at);
          create index if not exists idx_incidents_severity on incidents(severity);
          create index if not exists idx_incidents_service on incidents(service);
          create index if not exists idx_incidents_deployment_id on incidents(deployment_id);
          EOF

          # Create pull_requests table
          cat << 'EOF' | supabase db push
          create table if not exists pull_requests (
            id text primary key,
            number integer not null,
            first_commit_at timestamptz not null,
            created_at timestamptz not null,
            merged_at timestamptz,
            base_branch text not null,
            head_branch text not null,
            deployment_id text references deployments(id),
            metadata jsonb,
            created_at timestamptz default now(),
            updated_at timestamptz default now()
          );

          create index if not exists idx_pull_requests_created_at on pull_requests(created_at);
          create index if not exists idx_pull_requests_merged_at on pull_requests(merged_at);
          create index if not exists idx_pull_requests_base_branch on pull_requests(base_branch);
          EOF

          # Create DORA metrics results table
          cat << 'EOF' | supabase db push
          create table if not exists dora_metrics_results (
            id uuid primary key default gen_random_uuid(),
            calculated_at timestamptz not null,
            period_start timestamptz not null,
            period_end timestamptz not null,
            deployment_frequency numeric not null,
            lead_time_for_changes numeric not null,
            change_failure_rate numeric not null,
            mean_time_to_recovery numeric not null,
            deployment_performance_level text not null,
            lead_time_performance_level text not null,
            failure_rate_performance_level text not null,
            mttr_performance_level text not null,
            data_points_deployments integer not null,
            data_points_incidents integer not null,
            data_points_pull_requests integer not null,
            created_at timestamptz default now()
          );

          create index if not exists idx_dora_metrics_calculated_at on dora_metrics_results(calculated_at);
          create index if not exists idx_dora_metrics_period on dora_metrics_results(period_start, period_end);
          EOF

          # Create DORA metric snapshots table
          cat << 'EOF' | supabase db push
          create table if not exists dora_metric_snapshots (
            id uuid primary key default gen_random_uuid(),
            timestamp timestamptz not null,
            value numeric not null,
            metadata jsonb not null,
            metric_type text not null check (metric_type in ('deployment-frequency', 'lead-time-for-changes', 'change-failure-rate', 'mean-time-to-recovery')),
            created_at timestamptz default now()
          );

          create index if not exists idx_dora_snapshots_timestamp on dora_metric_snapshots(timestamp);
          create index if not exists idx_dora_snapshots_metric_type on dora_metric_snapshots(metric_type);
          EOF

      - name: Collect deployment events
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const { execSync } = require('child_process');
          const fs = require('fs');

          // Get recent deployments (merged PRs to main)
          const timeWindowDays = process.env.INPUT_TIME_WINDOW_DAYS || '30';
          const sinceDate = new Date(Date.now() - (parseInt(timeWindowDays) * 24 * 60 * 60 * 1000)).toISOString();

          console.log('Collecting deployment events since:', sinceDate);

          // Get merged PRs to main branch
          const prs = JSON.parse(execSync(\`gh pr list --repo \${GITHUB_REPOSITORY} --base main --state merged --json number,mergedAt,headRefName,title --limit 100\`, { encoding: 'utf-8' }));

          const deployments = [];

          for (const pr of prs) {
            if (new Date(pr.mergedAt) >= new Date(sinceDate)) {
              // Get commit SHA for this PR
              const commits = JSON.parse(execSync(\`gh pr view \${pr.number} --repo \${GITHUB_REPOSITORY} --json commits --jq '.commits[-1].oid'\`, { encoding: 'utf-8' }));

              deployments.push({
                id: \`deploy-\${pr.number}\`,
                timestamp: pr.mergedAt,
                commit_sha: commits,
                environment: 'production',
                service: 'agency-platform',
                status: 'success',
                metadata: {
                  pr_number: pr.number,
                  pr_title: pr.title,
                  branch: pr.headRefName
                }
              });
            }
          }

          console.log(\`Found \${deployments.length} deployments\`);

          // Write deployments to file
          fs.writeFileSync('deployments.json', JSON.stringify(deployments, null, 2));
          "

      - name: Collect pull request events
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const { execSync } = require('child_process');
          const fs = require('fs');

          const timeWindowDays = process.env.INPUT_TIME_WINDOW_DAYS || '30';
          const sinceDate = new Date(Date.now() - (parseInt(timeWindowDays) * 24 * 60 * 60 * 1000)).toISOString();

          console.log('Collecting pull request events since:', sinceDate);

          // Get PRs created in the time window
          const prs = JSON.parse(execSync(\`gh pr list --repo \${GITHUB_REPOSITORY} --state all --json number,createdAt,mergedAt,baseRefName,headRefName,title --limit 200\`, { encoding: 'utf-8' }));

          const pullRequests = [];

          for (const pr of prs) {
            if (new Date(pr.createdAt) >= new Date(sinceDate)) {
              // Get first commit date for this PR
              try {
                const commits = JSON.parse(execSync(\`gh pr view \${pr.number} --repo \${GITHUB_REPOSITORY} --json commits --jq '.commits | .[-1] | {oid: .oid, date: .committedDate}'\`, { encoding: 'utf-8' }));

                pullRequests.push({
                  id: \`pr-\${pr.number}\`,
                  number: pr.number,
                  first_commit_at: commits.date,
                  created_at: pr.createdAt,
                  merged_at: pr.mergedAt || null,
                  base_branch: pr.baseRefName,
                  head_branch: pr.headRefName,
                  metadata: {
                    pr_title: pr.title,
                    commit_sha: commits.oid
                  }
                });
              } catch (error) {
                console.log(\`Skipping PR \${pr.number} due to error:\`, error.message);
              }
            }
          }

          console.log(\`Found \${pullRequests.length} pull requests\`);

          // Write pull requests to file
          fs.writeFileSync('pull-requests.json', JSON.stringify(pullRequests, null, 2));
          "

      - name: Calculate DORA metrics and store in database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIME_WINDOW_DAYS: ${{ github.event.inputs.time_window_days || '30' }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const { DORAMetricsCollector } = require('./packages/metrics/dist/index.js');
          const fs = require('fs');

          // Load collected data
          const deployments = JSON.parse(fs.readFileSync('deployments.json', 'utf-8'));
          const pullRequests = JSON.parse(fs.readFileSync('pull-requests.json', 'utf-8'));

          // Create Supabase client
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);

          // Store deployments in database
          console.log('Storing deployments in database...');
          for (const deployment of deployments) {
            const { error } = await supabase.from('deployments').upsert({
              id: deployment.id,
              timestamp: deployment.timestamp,
              commit_sha: deployment.commit_sha,
              environment: deployment.environment,
              service: deployment.service,
              status: deployment.status,
              metadata: deployment.metadata
            });

            if (error) {
              console.warn(\`Error storing deployment \${deployment.id}:\`, error.message);
            } else {
              console.log(\`✅ Stored deployment: \${deployment.id}\`);
            }
          }

          // Store pull requests in database
          console.log('Storing pull requests in database...');
          for (const pr of pullRequests) {
            const { error } = await supabase.from('pull_requests').upsert({
              id: pr.id,
              number: pr.number,
              first_commit_at: pr.first_commit_at,
              created_at: pr.created_at,
              merged_at: pr.merged_at,
              base_branch: pr.base_branch,
              head_branch: pr.head_branch,
              metadata: pr.metadata
            });

            if (error) {
              console.warn(\`Error storing PR \${pr.id}:\`, error.message);
            } else {
              console.log(\`✅ Stored PR: \${pr.id}\`);
            }
          }

          // Configure and calculate metrics
          const config = {
            timeWindowDays: parseInt(process.env.TIME_WINDOW_DAYS),
            environments: ['production'],
            services: [],
            alertThresholds: {
              deploymentFrequency: 7,
              leadTimeForChanges: 24,
              changeFailureRate: 15,
              meanTimeToRecovery: 1
            }
          };

          const collector = new DORAMetricsCollector(config);

          // Calculate metrics
          collector.calculateMetrics()
            .then(async (result) => {
              console.log('DORA Metrics Calculation Results:');
              console.log('=====================================');
              console.log(\`Deployment Frequency: \${result.metrics.deploymentFrequency} deployments/week\`);
              console.log(\`Lead Time for Changes: \${result.metrics.leadTimeForChanges} hours\`);
              console.log(\`Change Failure Rate: \${result.metrics.changeFailureRate}%\`);
              console.log(\`Mean Time to Recovery: \${result.metrics.meanTimeToRecovery} hours\`);
              console.log('=====================================');

              // Store metrics results in database
              const { error: insertError } = await supabase.from('dora_metrics_results').insert({
                calculated_at: new Date().toISOString(),
                period_start: result.period.start,
                period_end: result.period.end,
                deployment_frequency: result.metrics.deploymentFrequency,
                lead_time_for_changes: result.metrics.leadTimeForChanges,
                change_failure_rate: result.metrics.changeFailureRate,
                mean_time_to_recovery: result.metrics.meanTimeToRecovery,
                deployment_performance_level: result.performanceLevels['deployment-frequency'].level,
                lead_time_performance_level: result.performanceLevels['lead-time-for-changes'].level,
                failure_rate_performance_level: result.performanceLevels['change-failure-rate'].level,
                mttr_performance_level: result.performanceLevels['mean-time-to-recovery'].level,
                data_points_deployments: result.dataPoints.deployments,
                data_points_incidents: result.dataPoints.incidents,
                data_points_pull_requests: result.dataPoints.pullRequests
              });

              if (insertError) {
                console.warn('Error storing metrics results:', insertError.message);
              } else {
                console.log('✅ Metrics results stored in database');
              }

              // Store results for workflow
              fs.writeFileSync('metrics-results.json', JSON.stringify(result, null, 2));

              // Set output variables
              console.log(\`::set-output name=deployment-frequency::\${result.metrics.deploymentFrequency}\`);
              console.log(\`::set-output name=lead-time::\${result.metrics.leadTimeForChanges}\`);
              console.log(\`::set-output name=change-failure-rate::\${result.metrics.changeFailureRate}\`);
              console.log(\`::set-output name=mttr::\${result.metrics.meanTimeToRecovery}\`);
            })
            .catch(error => {
              console.error('Error calculating metrics:', error);
              process.exit(1);
            });
          "

      - name: Run DORA metrics alerting
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIME_WINDOW_DAYS: ${{ github.event.inputs.time_window_days || '30' }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');

          // Create Supabase client
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);

          // Run alerting logic
          console.log('🚨 Running DORA metrics alerting...');

          // Fetch recent metrics for comparison
          const { data: recentMetrics, error: fetchError } = await supabase
            .from('dora_metrics_results')
            .select('*')
            .gte('calculated_at', new Date(Date.now() - (60 * 24 * 60 * 60 * 1000)).toISOString())
            .order('calculated_at', { ascending: false })
            .limit(2);

          if (fetchError) {
            console.warn('Error fetching metrics for alerting:', fetchError.message);
            return;
          }

          if (recentMetrics && recentMetrics.length >= 2) {
            const current = recentMetrics[0];
            const previous = recentMetrics[1];

            console.log('Comparing current vs previous metrics...');

            // Check for significant regressions
            const regressions = [];

            // Deployment Frequency (lower is regression)
            if (current.deployment_frequency < previous.deployment_frequency * 0.8) {
              const change = ((current.deployment_frequency - previous.deployment_frequency) / previous.deployment_frequency) * 100;
              regressions.push({
                metric: 'Deployment Frequency',
                change: change.toFixed(1),
                severity: change < -50 ? 'critical' : change < -20 ? 'high' : 'medium'
              });
            }

            // Lead Time (higher is regression)
            if (current.lead_time_for_changes > previous.lead_time_for_changes * 1.2) {
              const change = ((current.lead_time_for_changes - previous.lead_time_for_changes) / previous.lead_time_for_changes) * 100;
              regressions.push({
                metric: 'Lead Time for Changes',
                change: change.toFixed(1),
                severity: change > 50 ? 'critical' : change > 20 ? 'high' : 'medium'
              });
            }

            // Change Failure Rate (higher is regression)
            if (current.change_failure_rate > previous.change_failure_rate * 1.2) {
              const change = ((current.change_failure_rate - previous.change_failure_rate) / previous.change_failure_rate) * 100;
              regressions.push({
                metric: 'Change Failure Rate',
                change: change.toFixed(1),
                severity: change > 50 ? 'critical' : change > 20 ? 'high' : 'medium'
              });
            }

            // MTTR (higher is regression)
            if (current.mean_time_to_recovery > previous.mean_time_to_recovery * 1.2) {
              const change = ((current.mean_time_to_recovery - previous.mean_time_to_recovery) / previous.mean_time_to_recovery) * 100;
              regressions.push({
                metric: 'Mean Time to Recovery',
                change: change.toFixed(1),
                severity: change > 50 ? 'critical' : change > 20 ? 'high' : 'medium'
              });
            }

            if (regressions.length > 0) {
              console.log('🚨 METRIC REGRESSIONS DETECTED:');
              regressions.forEach(regression => {
                const icon = regression.severity === 'critical' ? '🔴' : regression.severity === 'high' ? '🟠' : '🟡';
                console.log(\`   \${icon} \${regression.metric}: \${regression.change}% worse\`);
              });

              // Add to GitHub summary
              console.log('## 🚨 DORA Metrics Alert' >> process.env.GITHUB_STEP_SUMMARY);
              console.log('### Metric Regressions Detected' >> process.env.GITHUB_STEP_SUMMARY);
              regressions.forEach(regression => {
                const icon = regression.severity === 'critical' ? '🔴' : regression.severity === 'high' ? '🟠' : '🟡';
                console.log(\`- \${icon} **\${regression.metric}**: \${regression.change}% worse\` >> process.env.GITHUB_STEP_SUMMARY);
              });

              // Exit with error for critical regressions
              if (regressions.some(r => r.severity === 'critical')) {
                console.log('❌ Critical regressions detected!');
                process.exit(1);
              }
            } else {
              console.log('✅ No significant metric regressions detected');
              console.log('## ✅ DORA Metrics Alert' >> process.env.GITHUB_STEP_SUMMARY);
              console.log('No significant metric regressions detected. All metrics are stable or improving.' >> process.env.GITHUB_STEP_SUMMARY);
            }
          } else {
            console.log('ℹ️  Insufficient data for alerting (need at least 2 data points)');
          }
          "

      - name: Upload metrics results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dora-metrics-results
          path: |
            metrics-results.json
            deployments.json
            pull-requests.json
          retention-days: 30

      - name: Generate metrics summary
        if: always()
        run: |
          if [ -f "metrics-results.json" ]; then
            echo "## DORA Metrics Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value | Performance Level |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|-------------------|" >> $GITHUB_STEP_SUMMARY

            node -e "
            const result = JSON.parse(require('fs').readFileSync('metrics-results.json', 'utf-8'));
            console.log(\`| Deployment Frequency | \${result.metrics.deploymentFrequency} deployments/week | \${result.performanceLevels['deployment-frequency'].level} |\`);
            console.log(\`| Lead Time for Changes | \${result.metrics.leadTimeForChanges} hours | \${result.performanceLevels['lead-time-for-changes'].level} |\`);
            console.log(\`| Change Failure Rate | \${result.metrics.changeFailureRate}% | \${result.performanceLevels['change-failure-rate'].level} |\`);
            console.log(\`| Mean Time to Recovery | \${result.metrics.meanTimeToRecovery} hours | \${result.performanceLevels['mean-time-to-recovery'].level} |\`);
            " >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Data Points" >> $GITHUB_STEP_SUMMARY
            echo "- Deployments: $(jq -r '.dataPoints.deployments' metrics-results.json)" >> $GITHUB_STEP_SUMMARY
            echo "- Incidents: $(jq -r '.dataPoints.incidents' metrics-results.json)" >> $GITHUB_STEP_SUMMARY
            echo "- Pull Requests: $(jq -r '.dataPoints.pullRequests' metrics-results.json)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Metrics Collection Failed" >> $GITHUB_STEP_SUMMARY
            echo "Unable to generate metrics results. Check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  setup-webhooks:
    name: Setup GitHub Webhooks
    runs-on: ubuntu-latest
    needs: collect-metrics
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.setup_webhooks == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          gh --version
          echo "GitHub CLI ready"

      - name: Create webhook for automated event collection
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # Check if webhook already exists
          EXISTING_WEBHOOK=$(gh api repos/:owner/:repo/hooks | jq -r '.[] | select(.config.url == "${{ secrets.WEBHOOK_URL }}/api/webhooks/github") | .id' || echo "")

          if [ -z "$EXISTING_WEBHOOK" ]; then
            echo "Creating new webhook for DORA metrics collection..."

            gh api repos/:owner/:repo/hooks \
              --method POST \
              --field events='["push", "pull_request", "issues"]' \
              --field active=true \
              --field config.url="${{ secrets.WEBHOOK_URL }}/api/webhooks/github" \
              --field config.content_type=json \
              --field config.secret="${{ secrets.GITHUB_WEBHOOK_SECRET }}" \
              --field config.insecure_ssl=false

            echo "✅ Webhook created successfully"
          else
            echo "✅ Webhook already exists (ID: $EXISTING_WEBHOOK)"
          fi

  generate-dashboard:
    name: Generate Dashboard Report
    runs-on: ubuntu-latest
    needs: collect-metrics
    if: always() && needs.collect-metrics.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate dashboard report
        env:
          TIME_WINDOW_DAYS: ${{ github.event.inputs.time_window_days || '30' }}
        run: |
          pnpm tsx scripts/metrics/metrics-dashboard.ts \
            --time-window-days $TIME_WINDOW_DAYS \
            --format html \
            --output dora-metrics-dashboard.html

      - name: Upload dashboard report
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics-dashboard
          path: dora-metrics-dashboard.html
          retention-days: 30
