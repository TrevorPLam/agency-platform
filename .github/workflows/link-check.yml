name: Documentation Link Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run markdown link check
        run: |
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./.next/*" -not -path "./.git/*" | \
          xargs -I {} npx markdown-link-check --config .markdownlinkcheck.json "{}"

  link-check-report:
    runs-on: ubuntu-latest
    needs: markdown-link-check
    if: failure()
    steps:
      - name: Create issue for broken links
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = '🔗 Broken Documentation Links Detected';
            const body = `
            ## Broken Links Found
            
            The automated link check found broken documentation links in the repository.
            
            ### Next Steps
            1. Review the failed workflow logs for specific broken links
            2. Update or remove the broken links
            3. Run the link check locally to verify fixes
            
            ### Local Testing
            \`\`\`bash
            # Install dependencies
            pnpm install
            
            # Run link check
            find . -name "*.md" -not -path "./node_modules/*" | xargs -I {} npx markdown-link-check --config .markdownlinkcheck.json "{}"
            \`\`\`
            
            ### Configuration
            Link checking is configured via \`.markdownlinkcheck.json\`.
            
            ---
            This issue was automatically created by GitHub Actions.
            `;
            
            github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['documentation', 'broken-links', 'automated']
            });
